name: Deploy to GCE prod

on:
  push:
    branches:
      - main

# One prod deploy at a time. This job SSHes in and rebuilds /var/www/koinvote
# in place, so two overlapping runs would interleave `git pull`, `npm ci` and
# `npm run build` in the same directory and could leave a half-written dist.
#
# cancel-in-progress is deliberately false: killing a deploy mid-build is worse
# than making the next one wait, because what it leaves behind is a partial
# tree that is already being served.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NOTE: this job intentionally has NO `environment:` gate.
    #
    # A manual-approval gate was added on 2026-07-29 (PR #50) and removed the
    # same day, deliberately — not by accident. The project has a single
    # operator who was also the only required reviewer, and self-review had to
    # be permitted or the gate would have deadlocked. That makes it "press the
    # button twice": it stops a silent deploy, but not an unauthorised one,
    # since whoever holds that GitHub account can also approve.
    #
    # The observation behind it still stands and is worth keeping in mind: a
    # push to main is by itself code execution on the production host, and this
    # site displays Bitcoin deposit addresses, so a compromised GitHub account
    # is enough to serve modified JavaScript to every visitor.
    #
    # The gate also had a footgun of its own: waiting runs queued up, and each
    # run deploys its own commit, so approving an older one would overwrite a
    # newer deploy with stale code.
    #
    # If detection is wanted back without the friction, add a notification
    # rather than a gate — the Telegram step at the bottom of this file already
    # runs on every deploy and carries the actor and commit message.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The account this logs into is named after an engineer who left on
      # 2026-07-28, and it carries two production responsibilities:
      #
      #   1. It runs og-meta-server, via pm2-yichinweng.service. nginx sends
      #      /sitemap.xml, /render-meta/* and crawler hits on /event/{id} to
      #      it, so it is what produces the preview card when somebody shares
      #      an event link. Remove the account and shared links lose their
      #      preview and sitemap.xml starts 404ing.
      #   2. /var/www/koinvote and its ~37,000 files are owned by that UID,
      #      so this deploy writes as that user.
      #
      # Nothing about the account name says any of that, which is why the
      # same warning sits at the top of its authorized_keys on the host.
      #
      # PROD_GCE_SSH_PRIVATE_KEY was rotated on 2026-07-28 so that the copy
      # the departing engineer held no longer opens anything.
      - name: Deploy to GCE prod via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_GCE_HOST }}
          username: ${{ secrets.PROD_GCE_USER }}
          key: ${{ secrets.PROD_GCE_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/koinvote
            git fetch origin
            git checkout main
            git pull origin main
            npm ci
            npm run build
            rm -f dist/mockServiceWorker.js

      - name: Summarise the commit for the notification
        if: always()
        env:
          # Read through the environment, never interpolated into the script.
          # A commit message is attacker-controlled text and ${{ github }} inside
          # a run block would substitute it before the shell ever sees it.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Telegram rejects a message over 4096 characters. A squash merge puts
          # the entire pull request body into the commit message, so the whole
          # notification step fails and reports the deploy as failed - while the
          # deploy itself succeeded. A red run that means "the deploy worked" is
          # worse than no notification at all.
          {
            echo "COMMIT_SUBJECT<<COMMIT_SUBJECT_EOF"
            printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200
            echo "COMMIT_SUBJECT_EOF"
          } >> "$GITHUB_ENV"

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        if: always() # 確保無論成功或失敗都會跑這步
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 **部署通知**
            專案: ${{ github.repository }} PROD
            狀態: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}
            提交訊息: ${{ env.COMMIT_SUBJECT }}
            執行者: ${{ github.actor }}

            查看詳情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
