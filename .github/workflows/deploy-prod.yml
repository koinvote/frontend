name: Deploy to GCE prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NO APPROVAL IS REQUIRED TO REACH PRODUCTION. A push to main deploys
    # straight to the production host, unattended.
    #
    # This line names the `production` environment, which currently has zero
    # protection rules. It was added along with a required-reviewers rule, on
    # the reasoning that a push to main is by itself code execution on the
    # production host — this job SSHes in and rebuilds /var/www/koinvote, so a
    # compromised GitHub account was enough to serve modified JavaScript to
    # every visitor, including the Bitcoin deposit addresses the site displays.
    #
    # The rule was removed on 2026-07-29, deliberately: a single maintainer
    # approving their own deploys adds a step without adding a second pair of
    # eyes, and it took the deploy of this very file with it (the pending run
    # was cancelled the moment the rule was deleted). Sole-maintainer accounts
    # are protected by that account's own security, not by this gate.
    #
    # The line stays because it is not the gate — it is what makes deploys show
    # up in the repository's deployment history, and it is what a protection
    # rule would attach to. Re-enabling the gate is a settings change under
    # Settings → Environments → production, with no code change here.
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The account this logs into is named after an engineer who left on
      # 2026-07-28, and it carries two production responsibilities:
      #
      #   1. It runs og-meta-server, via pm2-yichinweng.service. nginx sends
      #      /sitemap.xml, /render-meta/* and crawler hits on /event/{id} to
      #      it, so it is what produces the preview card when somebody shares
      #      an event link. Remove the account and shared links lose their
      #      preview and sitemap.xml starts 404ing.
      #   2. /var/www/koinvote and its ~37,000 files are owned by that UID,
      #      so this deploy writes as that user.
      #
      # Nothing about the account name says any of that, which is why the
      # same warning sits at the top of its authorized_keys on the host.
      #
      # PROD_GCE_SSH_PRIVATE_KEY was rotated on 2026-07-28 so that the copy
      # the departing engineer held no longer opens anything.
      - name: Deploy to GCE prod via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_GCE_HOST }}
          username: ${{ secrets.PROD_GCE_USER }}
          key: ${{ secrets.PROD_GCE_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/koinvote
            git fetch origin
            git checkout main
            git pull origin main
            npm ci
            npm run build
            rm -f dist/mockServiceWorker.js

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        if: always() # 確保無論成功或失敗都會跑這步
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 **部署通知**
            專案: ${{ github.repository }} PROD
            狀態: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}
            提交訊息: ${{ github.event.head_commit.message }}
            執行者: ${{ github.actor }}

            查看詳情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
