name: Deploy to GCE dev

on:
  push:
    branches:
      - dev

# One server per environment, so one deploy at a time. Two overlapping runs
# rsync into the same directory and rebuild in place; the backend had its redis
# container torn down this way on 2026-07-30 when two pull requests merged
# fifteen seconds apart.
#
# Queued rather than cancelled: a half-finished deploy is worse than a repeated
# one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/koinvote
            git fetch origin
            git checkout dev
            git pull origin dev
            npm ci
            npm run build:dev

      - name: Summarise the commit for the notification
        if: always()
        env:
          # Read through the environment, never interpolated into the script.
          # A commit message is attacker-controlled text and ${{ github }} inside
          # a run block would substitute it before the shell ever sees it.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Telegram rejects a message over 4096 characters. A squash merge puts
          # the entire pull request body into the commit message, so the whole
          # notification step fails and reports the deploy as failed - while the
          # deploy itself succeeded. A red run that means "the deploy worked" is
          # worse than no notification at all.
          {
            echo "COMMIT_SUBJECT<<COMMIT_SUBJECT_EOF"
            printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200
            echo "COMMIT_SUBJECT_EOF"
          } >> "$GITHUB_ENV"

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        if: always() # 確保無論成功或失敗都會跑這步
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 **部署通知**
            專案: ${{ github.repository }} DEV
            狀態: ${{ job.status == 'success' && '✅ 成功' || '❌ 失敗' }}
            提交訊息: ${{ env.COMMIT_SUBJECT }}
            執行者: ${{ github.actor }}

            查看詳情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
